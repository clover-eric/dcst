services:
  dcst:
    image: "${DCST_IMAGE:-ghcr.io/clover-eric/dcst:latest}"
    build:
      context: .
      args:
        GO_IMAGE: "${GO_IMAGE:-golang:1.27-alpine}"
        ALPINE_IMAGE: "${ALPINE_IMAGE:-alpine:3.22}"
    container_name: dcst
    restart: unless-stopped
    init: true
    ports:
      - "${DCST_PORT:-10123}:10123"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      LISTEN_ADDR: ":10123"
      INTERVAL_MINUTES: "${INTERVAL_MINUTES:-60}"
      CANDIDATES: "${CANDIDATES:-40}"
      STREAMS: "${STREAMS:-16}"
      TEST_DURATION_SECONDS: "${TEST_DURATION_SECONDS:-5}"
      WARMUP_SECONDS: "${WARMUP_SECONDS:-1}"
      TEST_PORT: "${TEST_PORT:-443}"
      TEST_URL: "${TEST_URL:-https://cf.xiu2.xyz/url}"
      MIN_SPEED_MB_S: "${MIN_SPEED_MB_S:-0}"
      MAX_LATENCY_MS: "${MAX_LATENCY_MS:-9999}"
      MAX_LOSS_RATE: "${MAX_LOSS_RATE:-1}"
      USE_IPV6: "${USE_IPV6:-true}"
      RUN_ON_START: "${RUN_ON_START:-true}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      UPDATE_ENDPOINT: "http://updater:8080/v1/update?async=true&container=dcst"
      UPDATE_TOKEN: "${UPDATE_API_TOKEN:-dcst-local-updater-change-me}"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - dcst-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:10123/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  updater:
    image: "${WATCHTOWER_IMAGE:-nickfedor/watchtower:1.23.2}"
    container_name: dcst-updater
    restart: unless-stopped
    init: true
    environment:
      WATCHTOWER_HTTP_API_ENDPOINTS: "update"
      WATCHTOWER_HTTP_API_TOKEN: "${UPDATE_API_TOKEN:-dcst-local-updater-change-me}"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dcst-data:
